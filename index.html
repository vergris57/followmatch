<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FollowsMatch — Des followers réels, en follow mutuel vérifié</title>
<meta name="description" content="Swipe. Match. Grandis. FollowsMatch met en relation des créateurs qui se suivent mutuellement, avec validation en 4 étapes et score de confiance.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0c0c14">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FollowsMatch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0c0c14; --panel:#15151f; --panel2:#1c1c2a; --line:#262637;
    --txt:#f2f2f8; --muted:#9494ab; --grad:linear-gradient(135deg,#7c3aed,#ec4899);
    --violet:#8b5cf6; --rose:#ec4899; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
    --r:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#07070c;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
  #phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(124,58,237,.15)}
  #screen{flex:1;overflow-y:auto;padding-bottom:92px}
  .hidden{display:none!important}

  /* ---------- composants ---------- */
  .wrap{padding:22px 20px}
  h1{font-size:26px;line-height:1.2}
  h2{font-size:20px;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;line-height:1.5}
  .logo{font-weight:800;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;color:#fff;background:var(--grad);transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.small{padding:10px 14px;font-size:14px;width:auto;display:inline-block}
  .btn:disabled{opacity:.4;cursor:default}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--txt);font-size:16px;outline:none}
  .field input:focus{border-color:var(--violet)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:14px;cursor:pointer;user-select:none}
  .chip.on{background:var(--grad);border-color:transparent;font-weight:700}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .avatar{border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0}
  .row{display:flex;align-items:center;gap:12px}
  .spacer{flex:1}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .center{text-align:center}
  .mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb16{margin-bottom:16px}

  /* niveaux */
  .lv-risque{background:rgba(156,163,175,.15);color:#9ca3af}
  .lv-standard{background:rgba(96,165,250,.15);color:#60a5fa}
  .lv-fiable{background:rgba(139,92,246,.18);color:#a78bfa}
  .lv-elite{background:rgba(251,191,36,.15);color:#fbbf24}

  /* bandeau démo */
  #demo{background:rgba(124,58,237,.12);border-bottom:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
  #demo b{color:var(--txt)}
  #demo button{margin-left:auto;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer}

  /* landing */
  .hero{padding:46px 24px 30px;text-align:center}
  .hero .logo{font-size:34px}
  .hero h1{font-size:24px;margin:14px 0 10px}
  .steps3{display:flex;flex-direction:column;gap:12px;margin:26px 0;text-align:left}
  .steps3 .card{display:flex;gap:14px;align-items:center}
  .steps3 .num{width:38px;height:38px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}

  /* onboarding */
  .obbar{display:flex;gap:6px;margin-bottom:22px}
  .obbar i{flex:1;height:4px;border-radius:4px;background:var(--panel2)}
  .obbar i.on{background:var(--grad)}
  .code{font-size:28px;font-weight:800;letter-spacing:3px;background:var(--panel2);border:1px dashed var(--violet);border-radius:14px;padding:16px;text-align:center;margin:14px 0}

  /* swipe */
  .deck{position:relative;height:430px;margin:14px 0 18px}
  .pcard{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;transition:transform .35s,opacity .35s}
  .pcard.back1{transform:scale(.95) translateY(12px);opacity:.6}
  .pcard.back2{transform:scale(.9) translateY(24px);opacity:.3}
  .pcard.fly-r{transform:translateX(120%) rotate(14deg);opacity:0}
  .pcard.fly-l{transform:translateX(-120%) rotate(-14deg);opacity:0}
  .pcard .avatar{width:110px;height:110px;font-size:40px;margin:6px auto 14px}
  .actions{display:flex;justify-content:center;gap:26px}
  .act{width:66px;height:66px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:26px;cursor:pointer;transition:transform .08s}
  .act:active{transform:scale(.9)}
  .act.like{background:var(--grad);border:none}
  .counter{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}

  /* matchs */
  .mitem{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer}
  .mitem .avatar{width:46px;height:46px;font-size:18px}
  .mitem .st{font-size:12.5px;margin-top:2px}
  .st.action{color:var(--rose);font-weight:700}
  .st.wait{color:var(--muted)}
  .st.done{color:var(--ok)}
  .st.exp{color:var(--bad)}
  .badge{min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
  .timer{font-size:12px;color:var(--warn);font-weight:700}

  /* stepper */
  .step{display:flex;gap:14px;position:relative;padding-bottom:26px}
  .step:last-child{padding-bottom:0}
  .step::before{content:'';position:absolute;left:15px;top:34px;bottom:0;width:2px;background:var(--line)}
  .step:last-child::before{display:none}
  .dot{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;z-index:1}
  .step.done .dot{background:rgba(52,211,153,.15);border-color:var(--ok);color:var(--ok)}
  .step.cur .dot{background:var(--grad);border:none;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,.4)}50%{box-shadow:0 0 0 9px rgba(236,72,153,0)}}
  .step h4{font-size:14.5px}
  .step p{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}

  /* profil */
  .gauge{width:190px;margin:6px auto;display:block}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .stat b{font-size:22px}
  .stat span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
  .ev{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:none}
  .delta-p{color:var(--ok);font-weight:700}.delta-n{color:var(--bad);font-weight:700}

  /* nav */
  #nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(18,18,28,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
  #nav button{flex:1;background:none;border:none;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  #nav button.on{color:#fff}
  #nav .ico{font-size:21px}
  #nav .badge{position:absolute;top:-4px;right:calc(50% - 24px)}

  /* toasts + modal */
  #toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(400px,92vw);z-index:60;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--panel2);border:1px solid var(--violet);border-radius:14px;padding:13px 15px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .3s}
  @keyframes tin{from{transform:translateY(-16px);opacity:0}}
  #modal{position:fixed;inset:0;background:rgba(5,5,10,.75);backdrop-filter:blur(4px);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
  #modal .box{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px 22px;width:100%;max-width:340px;text-align:center;animation:tin .25s}
  .duo{display:flex;justify-content:center;margin:14px 0 6px}
  .duo .avatar{width:74px;height:74px;font-size:28px;border:3px solid var(--bg)}
  .duo .avatar:last-child{margin-left:-16px}
  .big{font-size:40px}

  /* --- ajouts app réelle --- */
  .banner{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);border-radius:14px;padding:12px 14px;font-size:13.5px;margin:14px 20px 0}
  .authbox{margin-top:10px}
  .tabs2{display:flex;gap:8px;margin-bottom:16px}
  .tabs2 .chip{flex:1;text-align:center}
  .link{color:#a78bfa;cursor:pointer;text-decoration:underline}
  .admin-item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px;flex-wrap:wrap}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="phone">
  <div id="screen"><div class="wrap center" style="padding-top:80px"><span class="spin"></span> Chargement…</div></div>
  <div id="nav" class="hidden">
    <button id="nb-swipe" onclick="go('swipe')"><span class="ico">🔥</span>Swipe</button>
    <button id="nb-matches" onclick="go('matches')"><span class="ico">🤝</span>Matchs<span id="mbadge" class="badge hidden"></span></button>
    <button id="nb-profile" onclick="go('profile')"><span class="ico">👤</span>Profil</button>
  </div>
</div>
<div id="toasts"></div>
<script src="./supabase.js"></script>
<script src="./config.js"></script>
<script src="./app.js?v=8"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}</script>
</body>
</html>
